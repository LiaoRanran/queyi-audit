# =====================================================================
# queyi-audit — metadata for the anonymous reproducibility package.
#
# 713 fix (blocker 4 + anonymity leak L8): this file previously still described
# the *upstream* book-toolchain project (an upstream package name, a Chinese
# description of that book's build chain, an upstream console entry point and an
# upstream `[tool.*]` section) and declared `license = MIT` while the shipped
# LICENSE file is Apache-2.0. Both were wrong for this package, and the upstream
# identifiers were also a searchable identity leak. Rewritten below.
#
# This package is metadata-only: nothing here is installed to reproduce a
# number. REPRODUCTION.md uses `python -m pip install -r requirements.txt`
# (pytest is the sole third-party requirement) and then runs the tools in place.
# =====================================================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "queyi-audit"
version = "1.0.0"
description = "Reproducibility package for auditing software-verification evaluation: a measurement-drift algebra, a frozen 1,147 x 8 detection matrix, and paper-number recomputation from frozen artifacts."
readme = "README.md"
requires-python = ">=3.11"
# 713: was "MIT"; the shipped LICENSE (and README) are Apache-2.0. Kept in the
# PEP 621 table form so that setuptools>=61 accepts it.
license = {text = "Apache-2.0"}
authors = [
    {name = "Anonymous", email = "anonymous@example.org"}
]
keywords = ["reproducibility", "evaluation-audit", "measurement-drift", "benchmark-validity", "cpp", "sanitizers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Runtime dependencies of the reproduction path: none beyond the standard
# library. `tools/verify_paper_numbers.py` and everything exercised by
# `tests/` import only argparse/json/math/re/pathlib/hashlib/... (audited; see
# requirements.txt). The two tools that do import PyYAML (tools/gate_engine.py,
# tools/counts_659.py) are not on the reproduction path, so PyYAML is an
# optional extra rather than a hard dependency.
dependencies = []

[project.optional-dependencies]
# pytest is the only third-party requirement to re-run the shipped tests.
test = ["pytest>=7.0"]
# Optional: only needed if you also run the gate/lint tooling (not required by
# REPRODUCTION.md).
gates = ["pyyaml>=6.0"]
dev = ["pytest>=7.0", "ruff>=0.5.0", "mypy>=1.10.0"]

[project.urls]
# Deliberately identity-neutral: the package ships without a remote (see the
# anonymity report) and must not point at any author-owned account.
Homepage = "https://example.org/anonymous/queyi-audit"
Repository = "https://example.org/anonymous/queyi-audit"

[tool.setuptools]
# Metadata-only package: do not try to auto-discover and ship the tool scripts
# or the frozen data as importable Python packages.
packages = []
py-modules = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned rule set so that the warning count does not drift with the ruff
# version (E4/E7/E9/F plus import-sort I001 and FURB167).
select = ["E4", "E7", "E9", "F", "I001", "FURB167"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# tools/utils/ is the shared helper package under tools/; scripts and tests add
# `tools` to sys.path, so mypy cannot resolve `utils.*` from the repo root.
[[tool.mypy.overrides]]
module = "utils.*"
ignore_missing_imports = true

# PyYAML is an optional extra (see [project.optional-dependencies]); allow the
# two gate tools to be type-checked without a stub present.
[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]   # equivalent to tests/conftest.py's sys.path injection (pytest>=7)
tmp_path_retention_policy = "none"
addopts = "-q --tb=short"
markers = [
    "slow: tests taking >10s (WSL compile / full re-run); skipped by the local fast profile, covered by the CI slow profile",
]
